[project]
name = "churnlab"
version = "0.1.0"
description = "Reproducible churn prediction project on the IBM Telco Customer Churn dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy~=1.26.0",
    "pandas~=2.2.0",
    "scikit-learn~=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
